[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.0.1",
    "faster-whisper>=1.2.1",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "nltk>=3.9.4",
    "numpy>=2.4.6",
    "pyannote-audio>=4.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyloudnorm>=0.2.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "silero-vad>=6.2.1",
    "torch>=2.12.1",
    "torchaudio>=2.11.0",
    "torchcodec>=0.14.0",
]

[project.scripts]
generate-proto = "app.scripts.generate_proto:main"
ai-service = "app.main:main"
chaptering-build-units = "app.cli:chaptering_build_units"
chaptering-analyze-units = "app.cli:chaptering_analyze_units"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["proto"]
