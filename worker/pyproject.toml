[project]
name = "worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.14",
    "celery>=5.6.3",
    "cryptography>=46.0.3",
    "grpcio>=1.80.0",
    "numpy>=2.5.0",
    "pillow>=12.2.0",
    "protobuf>=7.35.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "sqlalchemy>=2.0.50",
]

[project.scripts]
transcript_worker = "app.cli:transcript_worker"
chaptering_worker = "app.cli:chaptering_worker"
media_previews_worker = "app.cli:media_previews_worker"
render_exports_worker = "app.cli:render_exports_worker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["proto"]
